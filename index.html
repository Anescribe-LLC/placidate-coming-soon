<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PLACIDATE™ | EMR Authentication</title>

  <meta
    name="description"
    content="PLACIDATE™ is a patent-pending authentication and account-recovery service for electronic medical record systems using the PDF417 barcode on a U.S. driver's license or government-issued ID."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #061329;
      color: #edf4fb;
    }

    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 36px;
    }

    .hero {
      background:
        radial-gradient(circle at top, rgba(34, 145, 198, 0.14), transparent 34%),
        linear-gradient(145deg, #142d4b 0%, #102542 58%, #0d2039 100%);

      border: 1px solid rgba(145, 194, 226, 0.18);
      border-radius: 28px;
      padding: 54px 52px 48px;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.30);
    }

    .logo {
      margin: 0 auto 26px;
      text-align: center;
    }

    .logo img {
      display: block;
      width: 100%;
      max-width: 430px;
      height: auto;
      margin: 0 auto;
    }

    .tagline {
      text-align: center;
      color: #bfd0df;
      font-size: 26px;
      font-weight: 300;
      margin-bottom: 20px;
    }

    .patent {
      display: table;
      margin: 0 auto 38px;
      padding: 8px 18px;
      border: 1px solid #44c6cf;
      border-radius: 999px;
      background: rgba(55, 193, 203, 0.08);
      color: #91e9ed;
      font-size: 14px;
      font-weight: 650;
    }

    .description {
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
      color: #d2deea;
      font-size: 19px;
      line-height: 1.7;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin: 46px 0 30px;
    }

    .feature {
      min-height: 165px;
      padding: 26px 24px;
      background: rgba(4, 17, 40, 0.48);
      border: 1px solid rgba(145, 194, 226, 0.14);
      border-radius: 17px;
    }

    .feature-title {
      color: #8be8ed;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .feature-text {
      color: #c5d3e0;
      font-size: 16px;
      line-height: 1.6;
    }

    .integration {
      margin-top: 8px;
      padding: 32px 34px;
      background: rgba(4, 17, 40, 0.52);
      border: 1px solid rgba(145, 194, 226, 0.14);
      border-radius: 18px;
    }

    .integration h2 {
      margin: 0 0 14px;
      text-align: center;
      color: #f2f6fa;
      font-size: 24px;
    }

    .integration-copy {
      max-width: 760px;
      margin: 0 auto 24px;
      text-align: center;
      color: #c7d4e1;
      font-size: 17px;
      line-height: 1.65;
    }

    .benefits {
      max-width: 720px;
      margin: 0 auto 28px;
      color: #c7d4e1;
      font-size: 16px;
      line-height: 2;
    }

    .availability {
      display: table;
      margin: 0 auto 20px;
      padding: 10px 24px;
      border: 1px solid #48cabf;
      border-radius: 999px;
      background: rgba(53, 201, 187, 0.08);
      color: #91ece4;
      font-size: 15px;
      font-weight: 700;
    }

    .cta {
      text-align: center;
    }

    .api-button {
      display: inline-block;
      min-width: 230px;
      padding: 15px 28px;
      border-radius: 11px;
      background: linear-gradient(135deg, #1ca8d4 0%, #157da9 100%);
      color: #ffffff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 12px 28px rgba(10, 124, 166, 0.25);
    }

    .api-button:hover {
      filter: brightness(1.08);
    }

    footer {
      margin-top: 34px;
      padding: 30px 10px 6px;
      border-top: 1px solid rgba(145, 194, 226, 0.15);
      text-align: center;
    }

    .physician-owned {
      color: #87e2e4;
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px 28px;
      margin-bottom: 16px;
    }

    .footer-links a {
      color: #c3d1df;
      text-decoration: none;
      font-size: 15px;
    }

    .footer-links a:hover {
      color: #8be7eb;
      text-decoration: underline;
    }

    .copyright {
      color: #8397ac;
      font-size: 13px;
    }

    @media (max-width: 800px) {
      .hero {
        padding: 42px 28px 36px;
      }

      .features {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .feature {
        min-height: auto;
      }

      .logo img {
        max-width: 380px;
      }
    }

    @media (max-width: 500px) {
      .page {
        width: calc(100% - 20px);
        padding-top: 12px;
      }

      .hero {
        padding: 34px 20px 30px;
        border-radius: 21px;
      }

      .logo img {
